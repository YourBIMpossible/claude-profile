name: install-tests

# The installer, the session-start sync, the machine config and the graphify scripts on Linux and Windows.
# Every test runs in a sandboxed HOME/USERPROFILE; no secrets, read-only token. The graphify tests need no graphify:
# the wrapper's own logic runs against stubbed graphify modules, and the tests that need the package, its binary or a
# real graph skip themselves.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-tests:
    name: install tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest==8.3.3

      - name: Installer, session-start sync, vendored pins, tools
        run: python -m pytest hooks/tests/test_bootstrap_install.py hooks/tests/test_vendor_pins.py tools/tests -q -p no:cacheprovider

      - name: Graphify scripts (the query wrapper and the graph resolver)
        run: python -m pytest skills/graphify/scripts -q -p no:cacheprovider
