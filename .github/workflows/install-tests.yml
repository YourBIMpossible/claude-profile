name: install-tests

# The gate (tools/gate.py) on Linux and Windows: every pytest suite in the repository (hooks, tools, graphify scripts)
# and the machine-paths guard. It is the same command the pre-push hook runs, so local and CI checks cannot drift.
# Every test runs in a sandboxed HOME/USERPROFILE; no secrets, read-only token. The graphify tests need no graphify:
# the wrapper's own logic runs against stubbed graphify modules, and the tests that need the package, its binary or a
# real graph skip themselves.
# Cost posture (2026-11-02): this repo is private, so every minute is billed, Windows at double. This lane no longer
# fires on pull requests; the pre-push hook (.githooks/pre-push) runs the same gate on every push. It stays as a
# deliberate audit: `gh workflow run install-tests.yml --ref <branch>` when a clean-runner confirmation is wanted.
# The only automatic remote check is .github/workflows/machine-paths.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-tests:
    name: install tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest==8.3.3

      - name: The gate (what the pre-push hook runs)
        run: python tools/gate.py --verbose
